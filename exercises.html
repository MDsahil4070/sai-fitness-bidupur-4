<html lang="en">

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #070b09;
            color: #e8f1eb;
            font-family: "Inter", sans-serif;
        }

        .exercise-page {
            width: 100%;
            max-width: 520px;
            margin: auto;
            min-height: 100vh;
            padding-bottom: 100px;
        }

        /* HEADER */

        .top-header {
            position: sticky;
            top: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: rgba(7, 11, 9, .92);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255,255,255,.06);
        }

        .back-btn,
        .header-icon {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,.07);
            background: #101713;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .header-title {
            font-size: 17px;
            font-weight: 800;
        }

        /* HERO */

        .hero {
            margin: 18px 16px;
            padding: 22px;
            border-radius: 24px;
            background:
                radial-gradient(circle at 90% 10%,
                rgba(57,229,140,.20),
                transparent 40%),
                linear-gradient(145deg,#111a15,#0c120f);
            border: 1px solid rgba(57,229,140,.12);
            overflow: hidden;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 11px;
            border-radius: 30px;
            background: rgba(57,229,140,.10);
            color: #39e58c;
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .hero h1 {
            margin: 0;
            font-size: 27px;
            line-height: 1.2;
        }

        .hero p {
            color: #8b9990;
            font-size: 13px;
            line-height: 1.6;
            margin: 10px 0 0;
        }

        /* SEARCH */

        .search-box {
            margin: 0 16px 15px;
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #7d8c83;
        }

        .search-box input {
            width: 100%;
            height: 50px;
            border: 1px solid rgba(255,255,255,.07);
            background: #101713;
            color: white;
            outline: none;
            border-radius: 16px;
            padding: 0 15px 0 45px;
            font-size: 13px;
        }

        .search-box input:focus {
            border-color: rgba(57,229,140,.45);
        }

        /* FILTER */

        .filter-wrap {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 0 16px 15px;
            scrollbar-width: none;
        }

        .filter-wrap::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            flex: 0 0 auto;
            border: 1px solid rgba(255,255,255,.07);
            background: #101713;
            color: #9ba79f;
            padding: 9px 14px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .filter-btn.active {
            color: #06110b;
            background: #39e58c;
            border-color: #39e58c;
        }

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 16px 12px;
        }

        .section-title h2 {
            margin: 0;
            font-size: 16px;
        }

        .result-count {
            color: #7e8b83;
            font-size: 11px;
        }

        .exercise-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 16px;
        }

        .exercise-card {
            background: #101713;
            border: 1px solid rgba(255,255,255,.06);
            border-radius: 20px;
            padding: 14px;
            cursor: pointer;
            transition: .25s ease;
            min-width: 0;
        }

        .exercise-card:hover {
            transform: translateY(-3px);
            border-color: rgba(57,229,140,.30);
        }

        .exercise-card:active {
            transform: scale(.98);
        }

        .exercise-icon {
            height: 86px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #39e58c;
            background:
                radial-gradient(circle at center,
                rgba(57,229,140,.15),
                rgba(57,229,140,.03));
            margin-bottom: 12px;
        }

        .exercise-card h3 {
            margin: 0 0 6px;
            font-size: 13px;
        }

        .exercise-meta {
            display: flex;
            justify-content: space-between;
            gap: 5px;
            color: #7f8c84;
            font-size: 9px;
        }

        .difficulty {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            margin-top: 9px;
            font-size: 9px;
            color: #39e58c;
        }

        /* EMPTY */

        .empty-state {
            display: none;
            text-align: center;
            padding: 45px 20px;
            color: #7f8c84;
        }

        .empty-state i {
            font-size: 38px;
            margin-bottom: 15px;
            opacity: .6;
        }

        .empty-state h3 {
            color: white;
            margin: 0 0 7px;
        }

        .empty-state p {
            font-size: 12px;
            margin: 0;
        }

        /* MODAL */

        .modal {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            background: rgba(0,0,0,.72);
            backdrop-filter: blur(10px);
            align-items: flex-end;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            background: #0d1410;
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 28px 28px 0 0;
            padding: 20px;
            animation: slideUp .28s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        .modal-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .modal-close {
            width: 40px;
            height: 40px;
            border: 0;
            border-radius: 13px;
            background: #171f1a;
            color: white;
            cursor: pointer;
        }

        .detail-icon {
            height: 130px;
            border-radius: 22px;
            background:
                radial-gradient(circle,
                rgba(57,229,140,.20),
                rgba(57,229,140,.03));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #39e58c;
            font-size: 55px;
            margin-bottom: 18px;
        }

        .detail-title {
            margin: 0;
            font-size: 24px;
        }

        .detail-category {
            margin-top: 6px;
            color: #39e58c;
            font-size: 11px;
            font-weight: 700;
        }

        .detail-description {
            color: #89968e;
            font-size: 12px;
            line-height: 1.7;
            margin: 12px 0 18px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2,1fr);
            gap: 9px;
            margin-bottom: 20px;
        }

        .info-box {
            background: #121a15;
            border: 1px solid rgba(255,255,255,.05);
            padding: 12px;
            border-radius: 15px;

        .info-box span {

            color: #76837b;
            font-size: 9px;
            margin-bottom: 5px;

            line-height: 1.6;

            grid-template-columns: repeat(5,1fr);
            padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
            background: rgba(8,12,10,.94);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,.06);
        }

            text-align: center;
            color: #68756d;
            font-size: 9px;
            cursor: pointer;
        }

        .nav-item i {
            display: block;
            font-size: 17px;
            margin-bottom: 4px;
        }

        .nav-item.active {
            color: #39e58c;
        }

        @media(max-width:360px) {

                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

</div>

        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ================================
   FILTER EXERCISES
================================ */

function getFilteredExercises() {

    return exercises.filter(exercise => {

        const categoryMatch =
            selectedCategory === "All" ||
            exercise.category === selectedCategory;

        const searchMatch =
            !searchTerm ||
            exercise.name.toLowerCase().includes(searchTerm) ||
            exercise.category.toLowerCase().includes(searchTerm) ||
            exercise.target.toLowerCase().includes(searchTerm) ||
            exercise.secondary.toLowerCase().includes(searchTerm);

        return categoryMatch && searchMatch;
    });
}


/* ================================
   RENDER CARDS
================================ */

function renderExercises() {

    const grid =
        document.getElementById("exerciseGrid");

    const empty =
        document.getElementById("emptyState");

    const count =
        document.getElementById("resultCount");

    const list = getFilteredExercises();

    count.textContent =
        list.length +
        (list.length === 1 ? " exercise" : " exercises");

    if (!list.length) {

        grid.innerHTML = "";
        empty.style.display = "block";
        return;
    }

    empty.style.display = "none";

    grid.innerHTML = list.map(exercise => {

        return `
            <article
                class="exercise-card"
                onclick="openExercise('${exercise.id}')"
            >

                <div class="exercise-icon">
                    <i class="${escapeExerciseHTML(exercise.icon)}"></i>
                </div>

                <h3>
                    ${escapeExerciseHTML(exercise.name)}
                </h3>

                <div class="exercise-meta">
                    <span>
                        ${escapeExerciseHTML(exercise.target)}
                    </span>

                    <span>
                        ${escapeExerciseHTML(exercise.reps)}
                    </span>
                </div>

                <div class="difficulty">
                    <i class="fa-solid fa-bolt"></i>
                    ${escapeExerciseHTML(exercise.difficulty)}
                </div>

            </article>
        `;

    }).join("");
}


/* ================================
   OPEN DETAILS
================================ */

function openExercise(id) {

    const exercise =
        exercises.find(item => item.id === id);

    if (!exercise) return;

    localStorage.setItem(
        "saiSelectedExercise",
        JSON.stringify(exercise)
    );

    const details =
        document.getElementById("exerciseDetails");

    details.innerHTML = `

        <div class="detail-icon">
            <i class="${escapeExerciseHTML(exercise.icon)}"></i>
        </div>

        <h2 class="detail-title">
            ${escapeExerciseHTML(exercise.name)}
        </h2>

        <div class="detail-category">
            ${escapeExerciseHTML(exercise.category)}
            •
            ${escapeExerciseHTML(exercise.target)}
        </div>

        <p class="detail-description">
            ${escapeExerciseHTML(exercise.description)}
        </p>

        <div class="info-grid">

            <div class="info-box">
                <span>Target Muscle</span>
                <strong>
                    ${escapeExerciseHTML(exercise.target)}
                </strong>
            </div>

            <div class="info-box">
                <span>Secondary</span>
                <strong>
                    ${escapeExerciseHTML(exercise.secondary)}
                </strong>
            </div>

            <div class="info-box">
                <span>Difficulty</span>
                <strong>
                    ${escapeExerciseHTML(exercise.difficulty)}
                </strong>
            </div>

            <div class="info-box">
                <span>Equipment</span>
                <strong>
                    ${escapeExerciseHTML(exercise.equipment)}
                </strong>
            </div>

            <div class="info-box">
                <span>Sets</span>
                <strong>
                    ${escapeExerciseHTML(exercise.sets)}
                </strong>
            </div>

            <div class="info-box">
                <span>Reps / Time</span>
                <strong>
                    ${escapeExerciseHTML(exercise.reps)}
                </strong>
            </div>

            <div class="info-box">
                <span>Rest</span>
                <strong>
                    ${escapeExerciseHTML(exercise.rest)}
                </strong>
            </div>

            <div class="info-box">
                <span>Calories</span>
                <strong>
                    ${escapeExerciseHTML(exercise.calories)}
                </strong>
            </div>

        </div>


        <div class="detail-section">

            <h3>
                <i class="fa-solid fa-list-ol"></i>
                How To Perform
            </h3>

            ${
                exercise.instructions.map((step,index) => `
                    <div class="instruction">

                        <div class="step-number">
                            ${index + 1}
                        </div>

                        <p>
                            ${escapeExerciseHTML(step)}
                        </p>

                    </div>
                `).join("")
            }

        </div>


        <div class="detail-section">

            <h3>
                <i class="fa-solid fa-lightbulb"></i>
                Pro Tip
            </h3>

            <div class="tips">
                <i class="fa-solid fa-circle-check"></i>
                ${escapeExerciseHTML(exercise.tips)}
            </div>

        </div>


        <button
            class="start-btn"
            onclick="startSelectedExercise()"
        >
            <i class="fa-solid fa-play"></i>
            Start This Exercise
        </button>
    `;

    document
        .getElementById("exerciseModal")
        .classList.add("show");

    document.body.style.overflow = "hidden";
}


/* ================================
   CLOSE MODAL
================================ */

function closeExerciseModal() {

    document
        .getElementById("exerciseModal")
        .classList.remove("show");

    document.body.style.overflow = "";
}


/* ================================
   START SELECTED EXERCISE
================================ */

function startSelectedExercise() {

    const selected =
        localStorage.getItem("saiSelectedExercise");

    if (!selected) return;

    location.href = "workout.html";
}


/* ================================
   SEARCH
================================ */

document
    .getElementById("exerciseSearch")
    .addEventListener("input", function() {

        searchTerm =
            this.value
                .trim()
                .toLowerCase();

        renderExercises();
    });


/* ================================
   CATEGORY FILTER
================================ */

document
    .querySelectorAll(".filter-btn")
    .forEach(button => {

        button.addEventListener("click", function() {

            document
                .querySelectorAll(".filter-btn")
                .forEach(btn =>
                    btn.classList.remove("active")
                );

            this.classList.add("active");

            selectedCategory =
                this.dataset.category;

            renderExercises();
        });

    });


/* ================================
   RESET SEARCH
================================ */

function resetExerciseSearch() {

    searchTerm = "";
    selectedCategory = "All";

    document.getElementById("exerciseSearch").value = "";

    document
        .querySelectorAll(".filter-btn")
        .forEach(btn => {

            btn.classList.remove("active");

            if (btn.dataset.category === "All") {
                btn.classList.add("active");
            }

        });

    renderExercises();
}


/* ================================
   MODAL EVENTS
================================ */

document
    .getElementById("exerciseModal")
    .addEventListener("click", function(event) {

        if (event.target === this) {
            closeExerciseModal();
        }

    });


document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {
        closeExerciseModal();
    }

});


/* ================================
   INITIALIZE
================================ */

document.addEventListener("DOMContentLoaded", function() {

    renderExercises();

});

</script>
<script src="app.js"></script>
</body>
</html>
